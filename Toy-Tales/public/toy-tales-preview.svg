<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Toy Tales preview</title>
  <desc id="desc">A preview showing the toy collection with cards, likes, and a donation form.</desc>
  <rect width="960" height="540" fill="#172554"/>
  <rect x="60" y="70" width="840" height="400" rx="30" fill="#111827" stroke="#f472b6" stroke-width="3"/>
  <text x="110" y="150" fill="#fdf4ff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Toy Tales</text>
  <text x="110" y="205" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="22">Load toys from the backend, add new ones, like them, and donate them.</text>
  <rect x="110" y="245" width="260" height="54" rx="12" fill="#f472b6"/>
  <text x="240" y="279" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Add a toy</text>
  <rect x="410" y="150" width="420" height="260" rx="18" fill="#1f2937" stroke="#c084fc"/>
  <rect x="438" y="180" width="150" height="170" rx="14" fill="#111827"/>
  <rect x="608" y="180" width="200" height="60" rx="12" fill="#312e81"/>
  <rect x="608" y="255" width="200" height="60" rx="12" fill="#312e81"/>
  <text x="455" y="235" fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Buzz</text>
  <text x="455" y="265" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="14">0 likes</text>
  <text x="625" y="216" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="18">Like</text>
  <text x="625" y="291" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="18">Donate</text>
</svg>
