<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Plant Shop preview</title>
  <desc id="desc">A preview of the plant shop app showing a search field, plant cards, and a form.</desc>
  <rect width="960" height="540" fill="#062e17"/>
  <rect x="60" y="70" width="840" height="400" rx="28" fill="#0f172a" stroke="#4ade80" stroke-width="3"/>
  <text x="110" y="150" fill="#ecfdf5" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Plant Shop</text>
  <text x="110" y="205" fill="#d1fae5" font-family="Arial, Helvetica, sans-serif" font-size="22">Load plants, add a new one, mark items sold out, and search your inventory.</text>
  <rect x="110" y="240" width="260" height="52" rx="12" fill="#22c55e"/>
  <text x="240" y="274" text-anchor="middle" fill="#052e16" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Search plants</text>
  <rect x="400" y="150" width="430" height="260" rx="18" fill="#14532d" stroke="#86efac"/>
  <rect x="430" y="185" width="150" height="180" rx="14" fill="#166534"/>
  <rect x="605" y="185" width="190" height="70" rx="14" fill="#14532d" stroke="#bbf7d0"/>
  <rect x="605" y="275" width="190" height="70" rx="14" fill="#14532d" stroke="#bbf7d0"/>
  <text x="445" y="235" fill="#f0fdf4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Monstera</text>
  <text x="445" y="270" fill="#bbf7d0" font-family="Arial, Helvetica, sans-serif" font-size="16">$24</text>
  <text x="445" y="330" fill="#dcfce7" font-family="Arial, Helvetica, sans-serif" font-size="14">Mark sold out</text>
  <text x="622" y="221" fill="#f0fdf4" font-family="Arial, Helvetica, sans-serif" font-size="18">New plant form</text>
  <text x="622" y="311" fill="#f0fdf4" font-family="Arial, Helvetica, sans-serif" font-size="18">Search results</text>
</svg>